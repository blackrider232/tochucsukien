<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e3a8a">
  <title>Ngoại tuyến · Sự kiện SCE</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #0f172a; }
    main { max-width: 28rem; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 28px 24px; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 1.25rem; }
    p { margin: 0 0 20px; color: #475569; line-height: 1.5; }
    a { display: inline-block; min-height: 40px; box-sizing: border-box; padding: 9px 18px; border-radius: 10px; background: #1d4ed8; color: #fff; font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #f1f5f9; } main { background: #1e293b; border-color: #334155; } p { color: #94a3b8; } }
  </style>
</head>
<body>
  <main>
    <h1>Ngoại tuyến</h1>
    <p>Không có kết nối mạng. Cần có mạng để xem và lưu dữ liệu sự kiện. Kiểm tra kết nối rồi thử lại.</p>
    <a href="/">Thử lại</a>
  </main>
</body>
</html>
